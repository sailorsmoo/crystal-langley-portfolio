<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequoia Benefits Design System — Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Archivo+Narrow:wght@600;700&family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mono/mono.css">
<style>:root{--sq-teal:#30BEC6;--sq-teal-2:#3BBCC4;--sq-navy:#293A52;--sq-green:#94C53B;--sq-purple:#8075F2;--sq-bg:#F2F5F7;--sq-text:#2A3950;--sq-text-muted:rgba(42,57,80,.5);--sq-text-dim:#9B9B9B;--sq-surface:#FFFFFF;--sq-text-dark:#4A4A4A;--sq-orange:#F97316;--sq-emerald:#22C55E;--sq-violet:#8B5CF6;--sq-amber:#F59E0B;--sq-red:#EF4444}</style>
<style>body{background:#fff}
body.capture header,body.capture .ds__head{display:none}
body.capture .ds__stats{border-top:0}
body.capture{padding:clamp(22px,2.4vw,34px) 0}
.ds{padding:0 var(--pad) clamp(30px,4vw,64px)}
.ds__head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;padding:var(--pad) var(--pad) clamp(18px,2vw,26px)}
.ds__head h1{font-size:clamp(24px,2.6vw,38px)}
.sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.ds__stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 var(--pad)}
.ds__stats div{padding:clamp(18px,2.2vw,30px) 16px clamp(18px,2.2vw,30px) 0}
.ds__stats div+div{padding-left:20px;border-left:1px solid var(--line)}
.ds__stats b{display:block;font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:700;font-size:clamp(30px,4vw,62px);line-height:.88;letter-spacing:-.02em}
.ds__stats span{display:block;margin-top:11px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ds__sec{padding:clamp(34px,4vw,60px) 0 0}
.ds__k{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-bottom:18px}
.ds__k .ln{flex:1;height:1px;background:var(--line)}
.note{margin-top:16px;max-width:64ch;font-size:12.5px;line-height:1.55;color:var(--mute);text-wrap:pretty}
.ramp{display:grid;gap:2px}
.ramp .hx{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em}
.ramp .lb{margin-top:8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ramp.sm .lb{margin-top:7px;font-size:9px;letter-spacing:.1em}
.ramp.xs{gap:1px}
.ramp.xs .lb{margin-top:6px;font-size:8.5px;letter-spacing:.06em}
.tri1 .ds__k{color:var(--ink);font-size:10.5px}
.tri1 .lb{color:var(--ink);font-size:10px}
.tri1 .hx{font-size:15px}
.tri2{opacity:.88}
.tri2 .ds__k,.tri2 .lb{font-size:9px;letter-spacing:.1em}
.tri3{opacity:.66}
.tri3 .ds__k{font-size:9px;color:var(--mute)}
.tri3 .lb{font-size:8px;letter-spacing:.05em}
.semi{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px}
.semi div{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.semi i{width:16px;height:16px;display:block}
.type .row{display:grid;grid-template-columns:150px 1fr 168px;gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.type .row:first-child{border-top:0}
.type .k,.type .v{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.type .v{text-align:right}
.scaleline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px}
.scaleline .u{text-align:center}
.scaleline i{display:block;background:var(--ds-accent,#000);height:8px;margin:0 auto}
.scaleline span{display:block;margin-top:8px;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.radii{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px}
.radii div{width:64px}
.radii i{display:block;height:42px;background:var(--sq-bg);border:1px solid var(--sq-teal)}
.radii span{display:block;margin-top:7px;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.radii em{display:block;margin-top:3px;font-size:8.5px;letter-spacing:.06em;color:var(--mute);font-style:normal;opacity:.7}
.trirow{display:grid;grid-template-columns:3.4fr 3fr 4.2fr;column-gap:clamp(20px,2.6vw,44px);row-gap:clamp(24px,3vw,40px);align-items:start}
.tworow{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(26px,3.4vw,58px);row-gap:clamp(24px,3vw,40px);align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));grid-auto-flow:row dense;column-gap:clamp(20px,2.4vw,38px);row-gap:clamp(26px,3vw,46px)}
.halves{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(20px,2.4vw,38px);row-gap:clamp(26px,3vw,46px);align-items:start}
.halves>.wide{grid-column:1/-1}
@media(max-width:900px){.trirow,.tworow,.halves{grid-template-columns:1fr}}
.cell{padding:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.cell__t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);overflow-wrap:anywhere}
.cell__t b{color:var(--ink);font-weight:600}
.cell__b{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.w2{grid-column:span 2}
.wide{grid-column:1/-1}
.logos{display:flex;flex-wrap:wrap;gap:clamp(16px,1.8vw,28px);align-items:flex-start}
.logos figure{margin:0;display:flex;flex-direction:column;gap:12px;width:260px;flex:0 0 auto}
.logos .lp{display:flex;align-items:center;justify-content:center;padding:26px;height:120px;box-sizing:border-box;background:var(--sq-surface);border:1px solid var(--line)}
.logos .lp--dark{background:var(--sq-navy);border-color:var(--sq-navy)}
.logos figcaption{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.5}
/* ---- Sequoia component specimens, authored at source values ---- */
.sq{font-family:Roboto,Archivo,system-ui,sans-serif;color:var(--sq-text);-webkit-font-smoothing:antialiased}
.sq *{box-sizing:border-box}
.sq h1,.sq h2,.sq h3,.sq h4,.sq h5,.sq h6{text-transform:none;letter-spacing:normal;font-family:inherit;font-weight:inherit;margin:0}
.sq a{border-bottom:0;text-decoration:none;color:inherit;letter-spacing:normal;text-transform:none}
.sq a:hover{color:inherit}
.sq b,.sq strong{letter-spacing:normal;text-transform:none}
.sq p,.sq em,.sq span,.sq button,.sq i{letter-spacing:normal;text-transform:none}
.sq-slab{font-family:"Roboto Slab",Georgia,serif;font-weight:400}
.sq-plate{background:var(--sq-bg);padding:24px;width:100%;box-sizing:border-box}
.sq-plate--w{background:var(--sq-surface);border:1px solid rgba(42,57,80,.08);border-radius:5px;padding:24px}
.sq-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.sq-col{display:flex;flex-direction:column;gap:12px}
.sq-cap{font-size:12px;color:var(--sq-text-dim)}
/* tags + badges */
.sq-tag{display:inline-flex;align-items:center;height:23px;padding:0 12px;border-radius:11.5px;font-size:12px;font-weight:500;white-space:nowrap}
.sq-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;border-radius:3px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
/* buttons */
.sq-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:3px;font-size:14px;font-weight:500;border:1px solid transparent;background:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.sq-btn--pri{background:var(--sq-teal);color:#fff}
.sq-btn--out{border-color:var(--sq-teal);color:var(--sq-teal);background:#fff}
.sq-btn--ghost{border-color:rgba(42,57,80,.18);color:var(--sq-text);background:#fff}
.sq-ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:3px;border:1px solid var(--sq-teal);background:#fff;color:var(--sq-teal)}
/* tabs */
.sq-tabs{display:flex;gap:32px;background:#fff;border-radius:5px;padding:18px 24px 0;box-shadow:0 1px 3px rgba(42,57,80,.08)}
.sq-tab{padding-bottom:14px;font-size:14px;color:var(--sq-text-muted);border-bottom:3px solid transparent;white-space:nowrap}
.sq-tab.on{color:var(--sq-teal);border-bottom-color:var(--sq-teal);font-weight:500}
.sq-sub{display:flex;gap:28px}
.sq-sub span{font-size:15px;color:var(--sq-text-dim);padding-bottom:7px;border-bottom:3px solid transparent}
.sq-sub span.on{color:var(--sq-teal);border-bottom-color:var(--sq-teal);font-weight:500}
/* search */
.sq-search{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:#fff;border:1px solid rgba(42,57,80,.12);border-radius:3px;flex:1;min-width:0}
.sq-search span{font-size:14px;color:var(--sq-text-dim)}
.sq-searchbar{display:flex;align-items:stretch;width:576px;max-width:100%}
.sq-searchbar .sq-search{border-radius:3px 0 0 3px;border-right:0}
.sq-searchbar button{width:94px;border:0;background:var(--sq-teal);color:#fff;font:500 14px/1 Roboto,sans-serif;border-radius:0 3px 3px 0;cursor:pointer}
/* hero */
.sq-hero{position:relative;overflow:hidden;border-radius:5px;padding:32px;background:linear-gradient(100deg,#30BEC6 0%,#3BBCC4 60%,#2BB3BC 100%);color:#fff;width:100%}
.sq-hero h3{font:500 26px/1.2 "Roboto Slab",Georgia,serif;margin:0;text-transform:none;letter-spacing:normal;color:#fff}
.sq-hero p{margin:10px 0 0;font-size:14px;max-width:32ch;line-height:1.45;opacity:.94}
.sq-hero .sq-orb{position:absolute;right:44px;top:26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.13)}
.sq-hero .sq-fld{display:flex;align-items:center;gap:10px;margin-top:20px;width:296px;max-width:100%;height:40px;padding:0 14px;background:#fff;border-radius:3px;color:var(--sq-text-dim);font-size:14px}
.sq-appbar{display:flex;align-items:center;gap:20px;border-radius:5px;padding:22px;background:linear-gradient(100deg,#30BEC6,#2BB3BC);color:#fff;width:100%}
.sq-appbar i{display:flex;align-items:center;justify-content:center;width:80px;height:80px;flex:0 0 80px;background:#fff;border-radius:5px;font:700 34px/1 Roboto,sans-serif;color:var(--sq-teal);font-style:normal}
.sq-appbar b{display:block;font:500 20px/1.2 "Roboto Slab",Georgia,serif}
.sq-appbar span{display:block;margin-top:4px;font-size:14px;opacity:.94}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px}
.icons figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center;padding:18px 8px;background:var(--sq-bg);border-radius:5px}
.icons i{display:flex;align-items:center;justify-content:center;width:34px;height:34px}
.icons i img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.icons figcaption{font:400 11px/1.35 Roboto,system-ui,sans-serif;color:var(--sq-text-muted)}
/* category pills */
.sq-cats{display:flex;flex-wrap:wrap;gap:28px;background:#fff;border-radius:5px;padding:24px;box-shadow:0 1px 3px rgba(42,57,80,.08)}
.sq-cats figure{margin:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sq-cats i{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--sq-teal);color:#fff;box-shadow:0 2px 8px rgba(48,190,198,.35)}
.sq-cats figcaption{font-size:12px;line-height:1.3;color:var(--sq-text)}
/* app cards */
.sq-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px;width:100%}
.sq-app{background:#fff;border-radius:5px;overflow:hidden;box-shadow:0 1px 3px rgba(42,57,80,.1);display:flex;flex-direction:column}
.sq-app__t{position:relative;height:78px;background:var(--sq-bg);display:flex;align-items:center;justify-content:center}
.sq-app__t i{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:8px;background:var(--sq-teal);color:#fff;font:700 26px/1 Roboto,sans-serif;font-style:normal}
.sq-app__i{position:absolute;left:10px;top:9px;color:var(--sq-text-dim)}
.sq-app__b{padding:14px 14px 12px}
.sq-app__b b{display:block;font:700 16px/1.25 Roboto,sans-serif}
.sq-app__b p{margin:7px 0 0;font-size:14px;line-height:1.4;color:var(--sq-text-muted)}
.sq-app__f{margin-top:auto;padding:11px 14px;border-top:1px solid rgba(42,57,80,.08);font-size:14px;color:var(--sq-teal)}
.sq-app--mk .sq-app__t{height:66px;justify-content:center;align-items:center}
.sq-app--mk .sq-app__t b{font:700 20px/1 "Roboto Slab",Georgia,serif;color:#fff}
.sq-app--mk .sq-app__t .sq-badge{position:absolute;left:9px;top:9px}
/* message cards */
.sq-msg{position:relative;display:flex;flex-direction:column;gap:8px;width:376px;max-width:100%;padding:16px 16px 14px 20px;background:#fff;border-radius:0 5px 5px 0;box-shadow:0 1px 3px rgba(42,57,80,.1)}
.sq-msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar)}
.sq-msg .sq-dots{color:var(--sq-text-dim);letter-spacing:2px;font-size:13px;line-height:1}
.sq-msg b{font:700 14px/1.3 Roboto,sans-serif}
.sq-msg em{font-size:14px;color:var(--sq-text-muted);font-style:italic}
.sq-msg .sq-fr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.sq-msg .sq-ic{display:flex;gap:12px;color:var(--sq-teal)}
/* stat tiles */
.sq-stats{display:flex;flex-wrap:wrap;gap:12px}
.sq-stat{width:98px;height:88px;border-radius:5px;background:#fff;box-shadow:0 1px 3px rgba(42,57,80,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.sq-stat b{font:400 30px/1 "Roboto Slab",Georgia,serif}
.sq-stat span{font-size:13px;color:var(--sq-text-muted)}
.sq-stat.on{background:var(--sq-teal)}
.sq-stat.on b,.sq-stat.on span{color:#fff}
/* reporting */
.sq-rep{background:#fff;border-radius:5px;padding:22px 24px;box-shadow:0 1px 3px rgba(42,57,80,.1);width:100%}
.sq-rep__h{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sq-rep__h b{font:500 18px/1.2 "Roboto Slab",Georgia,serif}
.sq-rep__h a{font-size:14px;color:var(--sq-teal);text-decoration:none;border-bottom:0}
.sq-figs{display:flex;flex-wrap:wrap;gap:34px;margin-top:18px}
.sq-figs div b{display:block;font:400 30px/1 "Roboto Slab",Georgia,serif}
.sq-figs div span{display:block;margin-top:7px;font-size:13px;color:var(--sq-text-muted)}
.sq-donut{display:flex;gap:26px;align-items:center;margin-top:16px;flex-wrap:wrap}
.sq-donut .sq-d{width:104px;height:104px;border-radius:50%;position:relative;flex:0 0 auto}
.sq-donut .sq-d::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#fff}
.sq-leg{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:13px}
.sq-leg i{width:9px;height:9px;border-radius:50%;display:block}
.sq-leg span:last-child{text-align:right;font-variant-numeric:tabular-nums}
/* contact + trending */
.sq-contact{display:flex;gap:18px;background:#fff;border-radius:5px;padding:22px;box-shadow:0 1px 3px rgba(42,57,80,.1);width:100%}
.sq-contact .sq-av{width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:linear-gradient(160deg,#BFD8DE,#9FC4CD);border:1px solid rgba(48,190,198,.5)}
.sq-contact b{display:block;font:700 16px/1.3 Roboto,sans-serif}
.sq-contact .sq-role{display:block;margin-top:3px;font-size:14px;color:var(--sq-text-muted)}
.sq-contact p{margin:10px 0 0;font-size:14px;line-height:1.5;max-width:52ch}
.sq-contact .sq-cta{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:14px;color:var(--sq-teal)}
.sq-trend{width:318px;max-width:100%;background:#fff;border-radius:5px;padding:20px 22px;box-shadow:0 1px 3px rgba(42,57,80,.1)}
.sq-trend b{display:block;font:700 14px/1.3 Roboto,sans-serif}
.sq-trend a{display:block;padding:12px 0;font-size:14px;line-height:1.35;color:var(--sq-teal);text-decoration:none;border-bottom:1px solid rgba(42,57,80,.08)!important}
.sq-trend a:last-child{border-bottom:0!important}
.sq-trend a:first-of-type{padding-top:16px}
.sq-navpair{display:flex;gap:22px;align-items:flex-start}
.sq-navpair figure{margin:0;display:flex;flex-direction:column;gap:11px}
.sq-navpair .fr{position:relative;background:var(--sq-navy);height:672px;overflow:hidden}
.sq-navpair .fr img{display:block;width:100%;height:auto;transform-origin:top left}
.sq-navpair .e{width:153px}
.sq-navpair .c{width:52.5px}
.sq-navpair .rsv img{width:63%;display:block;opacity:.96}
.sq-navpair .rsv{position:absolute;left:0;top:0;right:0;height:66px;display:flex;align-items:center;justify-content:center;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);text-align:center;padding:0 10px;line-height:1.3}
.sq-navpair figcaption{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.5}
.logos .lp img{display:block}
.sq-ham{display:flex;flex-direction:column;gap:5px}
.sq-ham i{display:block;width:24px;height:2px;background:currentColor}
a{color:var(--ink)}a:hover{color:var(--mute)}
</style>

<script type="text/babel" data-presets="react">


/* Sequoia Benefits design system snapshot.

    {r.note && <div className="note">{r.note}</div>}
  </div>;

const famCount = (cells) => cells.reduce((n, [,,, o = {}]) => n + (o.fams === undefined ? 1 : o.fams), 0);
function App() {
  const S = SYSTEM;
  const groupCells = S.groups.map(([label, build]) => [label, build()]);
  React.useLayoutEffect(() => {
    document.documentElement.style.setProperty('--ds-accent', V(S.accent));
    document.documentElement.style.setProperty('--ds-accent-soft', V(S.accentSoft));
  }, []);
  return <>
    <div className="ds__head"><div><h1>{S.name}</h1><div className="sub">{S.meta}</div></div></div>
    <div className="ds__stats">{S.stats.map(([b, l]) => <div key={l}><b>{b}</b><span>{l}</span></div>)}</div>
    <div className="ds">
      <Sec k="Logos" n="1 lockup, 1 mark, 2 polarities">
        <div className="logos">
          <figure><div className="lp" style={{ background: '#0f2623', padding: '30px 26px' }}><img src="/mono/assets/sq/sequoia-lockup.png" alt="Sequoia horizontal lockup" style={{ width: '100%', display: 'block' }} /></div><figcaption>Horizontal lockup · mark + wordmark · white on dark</figcaption></figure>
          <figure><div className="lp" style={{ background: '#0f2623' }}><img src="/mono/assets/sq/sequoia-tree.png" alt="Sequoia tree mark" style={{ width: 76, display: 'block' }} /></div><figcaption>Tree mark · in white keyline circle</figcaption></figure>
          <figure><div className="lp"><img src="/mono/assets/sq/sequoia-mark.svg" alt="Sequoia icon mark" style={{ width: 64 }} /></div><figcaption>Icon mark · 36 × 36 · Green #93C42C</figcaption></figure>
          <figure><div className="lp lp--dark"><img src="/mono/assets/sq/sequoia-mark.svg" alt="Sequoia icon mark on navy" style={{ width: 64 }} /></div><figcaption>Icon mark · on Navy · nav rail header</figcaption></figure>
        </div>
        <div className="note">{S.logoNote}</div>
      </Sec>
      <Sec k="Color" n="10 documented, 1 derived">
        <div className="trirow">{S.ramps.map((r) => <div key={r.label} className={r.tertiary ? 'tri3' : r.secondary ? 'tri2' : r.primary ? 'tri1' : ''}>
          <div className="ds__k" style={{ paddingBottom: 12 }}><span>{r.label}</span><span className="ln"></span><span>{rampLen(r)} values</span></div>
          <Ramp r={r} /></div>)}</div>
      </Sec>
      <Sec k="Semantic" n={S.semantic.length + ' derived states'}>
        <div className="semi">{S.semantic.map(([n, t]) => <div key={n}><i style={{ background: V(t) }}></i>{n} · {hex(V(t))}</div>)}</div>
        <div className="note">Five status colours drive the marketplace card headers and the reporting legends. None is named in the source sheet: each is read off the drawn components. They are not brand colours and never carry text.</div>
      </Sec>
      <Sec k="Type" n={S.type.families}>
        <div className="type">{S.type.rows.map(([n, f, s, px, fam]) =>
          <div className="row" key={n}><div className="k">{n}</div>
          <div style={{ fontFamily: fam === 'serif' ? S.type.serif : S.type.sans, fontSize: px + 'px', lineHeight: 1.2, color: 'var(--sq-text)' }}>Sequoia</div>
          <div className="v">{f}<br />{s}</div></div>)}</div>
        <div className="note">{S.type.note}</div>
      </Sec>
      <Sec k="Iconography" n={S.icons.length + ' glyphs'}>
        <div className="icons">{S.icons.map(([n, cap]) =>
          <figure key={n}><i><img src={'assets/sq/ic/' + n + '.png'} alt={cap} /></i><figcaption>{cap}</figcaption></figure>)}
        </div>
        <div className="note">{S.iconNote}</div>
      </Sec>
      <Sec k="Space and radius" n={S.scaleNote}>
        <div className="tworow">
          <div>
            <div className="scaleline">{S.space.map((v) => <div className="u" key={v}><i style={{ width: v + 'px' }}></i><span>{v}</span></div>)}</div>
            <div className="note" style={{ fontSize: 11.5 }}>{S.spaceNames.map(([v, n]) => n).join(' · ')}</div>
          </div>
          <div className="radii" style={{ marginTop: 0 }}>{S.radius.map(([v, n, m], i) => <div key={n + i}><i style={{ borderRadius: v + 'px' }}></i><span>{n}</span><em>{v === 999 ? 'r=full' : 'r=' + v + 'px'}{m ? ' · ' + m : ''}</em></div>)}</div>
        </div>
      </Sec>
      <div className="note" style={{ marginTop: 'clamp(30px,3.4vw,52px)' }}>Specimens are authored at the sizes and colours the sheet documents, on the App Background it names, rather than scaled art. One gap is the source’s, not the snapshot’s: every third-party app logo — Benefits, Wellbeing, ADP, Ginger.io, Headspace, Cleo — is a placed bitmap that exports as an empty reference from both the Figma file and the SVG sheet, so the app cards and the app banner stand in a letter avatar where the logo belongs.</div>
      {groupCells.map(([label, cells]) =>
      <Sec key={label} k={'Components · ' + label} n={famCount(cells) + (famCount(cells) === 1 ? ' family' : ' families')}>
          <div className={S.layouts[label] === 'halves' ? 'halves' : 'grid'}>{cells.map(([t, sub, node, o = {}], i) =>
          <div key={t + '-' + i} className={'cell' + (o.wide ? ' wide' : '') + (o.w2 ? ' w2' : '')}>
              <div className="cell__t"><b>{t}</b>{sub ? ' · ' + sub : ''}</div>
              <div className="cell__b"><Fit s={o.scale || 1}>{o.plate ? <div className="sq sq-plate">{node}</div> : node}</Fit></div>
            </div>)}
          </div>
        </Sec>)}
    </div>
  </>;
}
if (new URLSearchParams(location.search).get('capture') === '1') document.body.classList.add('capture');
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
