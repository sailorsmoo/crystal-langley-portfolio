<style>body{background:#fff}
body.capture header,body.capture .ds__head{display:none}
body.capture .ds__stats{border-top:0}
body.capture{padding:clamp(22px,2.4vw,34px) 0}
.ds{padding:0 var(--pad) clamp(30px,4vw,64px)}
.ds__head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;padding:var(--pad) var(--pad) clamp(18px,2vw,26px)}
.ds__head h1{font-size:clamp(24px,2.6vw,38px)}
.sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.ds__stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 var(--pad)}
.ds__stats div{padding:clamp(18px,2.2vw,30px) 16px clamp(18px,2.2vw,30px) 0}
.ds__stats div+div{padding-left:20px;border-left:1px solid var(--line)}
.ds__stats b{display:block;font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:700;font-size:clamp(30px,4vw,62px);line-height:.88;letter-spacing:-.02em}
.ds__stats span{display:block;margin-top:11px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ds__sec{padding:clamp(34px,4vw,60px) 0 0}
.ds__k{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding-bottom:18px}
.ds__k .ln{flex:1;height:1px;background:var(--line)}
.note{margin-top:16px;max-width:64ch;font-size:12.5px;line-height:1.55;color:var(--mute);text-wrap:pretty}
.ramp{display:grid;gap:2px}
.ramp .hx{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em}
.ramp .lb{margin-top:8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ramp.sm .lb{margin-top:7px;font-size:9px;letter-spacing:.1em}
.ramp.xs{gap:1px}
.ramp.xs .lb{margin-top:6px;font-size:8.5px;letter-spacing:.06em}
.tri1 .ds__k{color:var(--ink);font-size:10.5px}
.tri1 .lb{color:var(--ink);font-size:10px}
.tri1 .hx{font-size:15px}
.tri2{opacity:.88}
.tri2 .ds__k,.tri2 .lb{font-size:9px;letter-spacing:.1em}
.tri3{opacity:.66}
.tri3 .ds__k{font-size:9px;color:var(--mute)}
.tri3 .lb{font-size:8px;letter-spacing:.05em}
.semi{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px}
.semi div{display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.semi i{width:16px;height:16px;display:block}
.type .row{display:grid;grid-template-columns:150px 1fr 168px;gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.type .row:first-child{border-top:0}
.type .k,.type .v{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.type .v{text-align:right}
.scaleline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px}
.scaleline .u{text-align:center}
.scaleline i{display:block;background:var(--ds-accent,#000);height:8px;margin:0 auto}
.scaleline span{display:block;margin-top:8px;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.radii{display:flex;flex-wrap:wrap;gap:16px;margin-top:22px}
.radii div{width:64px}
.radii i{display:block;height:42px;background:var(--sq-bg);border:1px solid var(--sq-teal)}
.radii span{display:block;margin-top:7px;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.radii em{display:block;margin-top:3px;font-size:8.5px;letter-spacing:.06em;color:var(--mute);font-style:normal;opacity:.7}
.trirow{display:grid;grid-template-columns:3.4fr 3fr 4.2fr;column-gap:clamp(20px,2.6vw,44px);row-gap:clamp(24px,3vw,40px);align-items:start}
.tworow{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(26px,3.4vw,58px);row-gap:clamp(24px,3vw,40px);align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));grid-auto-flow:row dense;column-gap:clamp(20px,2.4vw,38px);row-gap:clamp(26px,3vw,46px)}
.halves{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(20px,2.4vw,38px);row-gap:clamp(26px,3vw,46px);align-items:start}
.halves>.wide{grid-column:1/-1}
@media(max-width:900px){.trirow,.tworow,.halves{grid-template-columns:1fr}}
.cell{padding:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.cell__t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);overflow-wrap:anywhere}
.cell__t b{color:var(--ink);font-weight:600}
.cell__b{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.w2{grid-column:span 2}
.wide{grid-column:1/-1}
.logos{display:flex;flex-wrap:wrap;gap:clamp(16px,1.8vw,28px);align-items:flex-start}
.logos figure{margin:0;display:flex;flex-direction:column;gap:12px;width:260px;flex:0 0 auto}
.logos .lp{display:flex;align-items:center;justify-content:center;padding:26px;height:120px;box-sizing:border-box;background:var(--sq-surface);border:1px solid var(--line)}
.logos .lp--dark{background:var(--sq-navy);border-color:var(--sq-navy)}
.logos figcaption{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.5}
.radii i{background:var(--db-n50);border:1px solid var(--db-p400)}
/* ---- Donblas component specimens, authored at source values ---- */
.db{font-family:Inter,system-ui,sans-serif;color:var(--db-body);-webkit-font-smoothing:antialiased}
.db *{box-sizing:border-box}
.db h1,.db h2,.db h3,.db h4{text-transform:none;letter-spacing:normal;font-family:inherit;font-weight:inherit;margin:0}
.db a{border-bottom:0;text-decoration:none;color:inherit;letter-spacing:normal;text-transform:none}
.db a:hover{color:inherit}
.db b,.db strong,.db p,.db em,.db span,.db button,.db i{letter-spacing:normal;text-transform:none}
.db-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.db-col{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.db-cap{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--db-n400)}
.db-plate{background:var(--db-n50);padding:24px;width:100%}
/* Button: 200x56, r=6, pad 16/12, Gotham 16 uppercase ls .02em */
.db-btn{width:200px;height:56px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 12px;font-family:'Jost',Inter,sans-serif;font-weight:400;font-size:16px;line-height:1.5;letter-spacing:.02em;text-transform:uppercase;border:0;cursor:default}
.db-btn svg{flex:0 0 auto}
/* Input field: 358 wide, exterior h55, 0.5px border, Gotham label 14/700 + input 16/500 */
.db-inp{width:358px;display:flex;flex-direction:column;gap:8px;font-family:'Jost',Inter,sans-serif}
.db-inp .ex{height:55px;border:.5px solid var(--db-n400);padding:4px 8px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.db-inp .lb{font-weight:700;font-size:14px;line-height:1.5;letter-spacing:.02em;color:var(--db-p950)}
.db-inp .it{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px;line-height:1.5;letter-spacing:.02em;color:var(--db-n700)}
.db-inp .it span{flex:1}
.db-inp .bt{display:flex;gap:8px;padding:4px 0;font-weight:500;font-size:14px;line-height:1.8;color:var(--db-n700)}
.db-inp .bt span:first-child{flex:1}
.db-inp .dd{border:.5px solid var(--db-n500);box-shadow:0 4px 6px -1px rgba(52,48,44,.1),0 2px 4px -2px rgba(52,48,44,.1);padding:0 8px;display:flex;flex-direction:column;gap:12px;background:#fff}
.db-inp .dd div{height:22px;display:flex;align-items:center;gap:8px;font-family:Inter,sans-serif;font-weight:500;font-size:12px;line-height:1.8;color:var(--db-n700)}
.db-inp .dd div span{flex:1}
/* Selection controls: 18x18, 1px #6382AF; checkbox r=2, radio r=full */
.db-sel{width:328px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.db-sel .hd{display:flex;align-items:center;gap:12px}
.db-sel .bx{width:18px;height:18px;border:1px solid var(--db-p400);flex:0 0 auto;display:grid;place-items:center;color:#fff}
.db-sel .bx--cb{border-radius:2px}
.db-sel .bx--rd{border-radius:999px}
.db-sel .bx--rd i{display:block;width:8px;height:8px;border-radius:999px;background:currentColor}
.db-sel .t1{flex:1;font-family:'Jost',Inter,sans-serif;font-weight:700;font-size:12px;line-height:1.5;color:#000}
.db-sel .t2{font-family:'Jost',Inter,sans-serif;font-weight:500;font-size:14px;line-height:1.5;letter-spacing:.02em;color:var(--db-n700)}
/* Toggle: 26x16, knob 14, r=27.375 */
.db-tg{width:26px;height:16px;border-radius:27.375px;position:relative;flex:0 0 auto}
.db-tg i{position:absolute;top:1px;width:14px;height:14px;border-radius:75px;background:#fff;display:block}
.db-tgrow{display:flex;align-items:center;gap:12px;font-family:Inter,sans-serif;font-size:11px;color:var(--db-n500)}
/* Tab: 56x34, r=4, 1px #101F36, pad 8/16, Gotham 12 */
.db-tab{height:34px;min-width:56px;border-radius:4px;border:1px solid var(--db-p950);padding:8px 16px;display:flex;align-items:center;justify-content:center;font-family:'Jost',Inter,sans-serif;font-weight:400;font-size:12px;line-height:1.5;color:var(--db-p950);white-space:nowrap}
/* Accordion: 319 wide, h41, 1px/0.5px #3D4452, Gotham 16/500 */
.db-acc{width:319px}
.db-acc .r{border:1px solid var(--db-n700);border-bottom-width:.5px;padding:0 0 12px;display:flex;flex-direction:column;justify-content:center}
.db-acc .r>div{height:29px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.db-acc .r span{flex:1;font-family:'Jost',Inter,sans-serif;font-weight:500;font-size:16px;line-height:1.8;color:var(--db-n700)}
.db-acc .bd{border:1px solid var(--db-n700);border-top:0;padding:12px;font-family:Manrope,Inter,sans-serif;font-size:14px;line-height:1.7;color:var(--db-n500)}
/* Price card: 400x544 desktop, label 115x37 r=6 6 0 0, container pad 32/24 */
.db-pc{width:400px;display:flex;flex-direction:column;font-family:Inter,sans-serif}
.db-pc .lbl{width:115px;height:37px;border-radius:6px 6px 0 0;background:var(--db-p700);display:flex;align-items:center;justify-content:center;padding:8px 12px;font-weight:700;font-size:12px;line-height:1.5;color:#fff}
.db-pc .ct{background:var(--db-p700);padding:32px 24px;display:flex;flex-direction:column;gap:16px}
.db-pc .hd{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;line-height:1.5;color:var(--db-p700)}
.db-pc .ds{font-weight:500;font-size:12px;line-height:1.8;color:#fff}
.db-pc .sh{font-weight:700;font-size:24px;line-height:1.5;color:#fff}
.db-pc .sp{border-top:1.5px solid var(--db-n50)}
.db-pc .fl{display:flex;flex-direction:column;gap:16px}
.db-pc .fi{display:flex;align-items:center;gap:12px;font-weight:500;font-size:14px;line-height:1.8;color:#fff}
.db-pc .fi i{width:20px;height:20px;border-radius:999px;background:#fff;display:grid;place-items:center;flex:0 0 auto;color:var(--db-p700)}
.db-pc .fi i.o{background:transparent;box-shadow:inset 0 0 0 1px #fff;color:#fff}
/* Logo plates */
.logos .lp{height:150px}
.dbmark{display:block;width:74px;height:91px;background:currentColor;-webkit-mask:url(assets/db/donblas-mark.svg) center/contain no-repeat;mask:url(assets/db/donblas-mark.svg) center/contain no-repeat}
.dblock{display:flex;align-items:center;gap:16px;color:currentColor}
.dblock .dbmark{width:52px;height:64px}
.dblock em{font-family:'Jost',Inter,sans-serif;font-style:normal;font-weight:500;font-size:26px;letter-spacing:.01em;line-height:1}
/* icon grid */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px}
.icons figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px 8px;background:var(--db-n50)}
.icons i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--db-p900)}
.icons figcaption{font-family:Inter,sans-serif;font-size:9.5px;letter-spacing:.04em;color:var(--db-n400);line-height:1.35}
.dual{display:flex;gap:10px;align-items:baseline}
.dual b{font-family:"Archivo Narrow",Archivo,sans-serif;font-size:13px;letter-spacing:.04em}
.dual span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
a{color:var(--ink)}a:hover{color:var(--mute)}
</style>

const hex = (c) => {c = (c || '').trim();if (c[0] === '#') return c.toUpperCase();const m = c.match(/[\d.]+/g);return m ? '#' + m.slice(0, 3).map((x) => Math.round(+x).toString(16).padStart(2, '0')).join('').toUpperCase() : c;};
const RAMP_H = { lg: 'clamp(96px,13vw,168px)', md: 'clamp(46px,6vw,74px)', md2: 'clamp(36px,4.2vw,50px)', sm: '30px', xs: '20px' };
const RAMP_CLS = { lg: '', md: 'sm', md2: 'xs', sm: 'xs', xs: 'xs' };
const Sec = ({ k, n, children }) => <section className="ds__sec"><div className="ds__k"><span>{k}</span><span className="ln"></span><span>{n}</span></div>{children}</section>;
function Fit({ s = 1, children }) {
  const box = React.useRef(null),inner = React.useRef(null);
  const [st, setSt] = React.useState({ h: null, k: s });
  React.useLayoutEffect(() => {const el = inner.current,wrap = box.current;if (!el || !wrap) return;
    const measure = () => {
      const avail = wrap.clientWidth;
      const nat = Math.max(el.scrollWidth, el.offsetWidth, 1);
      const k = Math.min(s, avail / nat);
      setSt((p) => Math.abs(p.k - k) < 0.002 && p.h === Math.ceil(el.offsetHeight * k) ? p : { h: Math.ceil(el.offsetHeight * k), k });
    };
    measure();const ro = new ResizeObserver(measure);ro.observe(el);ro.observe(wrap);return () => ro.disconnect();
  }, [s]);
  return <div className="fit" ref={box} style={{ width: '100%', overflow: 'hidden', height: st.h ? st.h + 'px' : 'auto' }}><div className="fit__inner" ref={inner} style={{ transform: 'scale(' + st.k + ')', transformOrigin: 'top left', width: s < 1 ? 'max-content' : '100%', maxWidth: s < 1 ? 100 / s + '%' : '100%' }}>{children}</div></div>;
}
const swatches = (r) => r.names;
const rampLen = (r) => swatches(r).length;
const rgbOf = (c) => {c = (c || '').trim();if (c[0] === '#') {let x = c.slice(1);if (x.length === 3) x = x.split('').map((d) => d + d).join('');return [0, 2, 4].map((i) => parseInt(x.substr(i, 2), 16));}const m = c.match(/[\d.]+/g);return m ? m.slice(0, 3).map(Number) : [255, 255, 255];};
const isLight = (c) => {const [r, g, b] = rgbOf(c);return 0.299 * r + 0.587 * g + 0.114 * b > 150;};
const Ramp = ({ r }) =>
<div>
    <div className={'ramp ' + RAMP_CLS[r.size]} style={{ gridTemplateColumns: 'repeat(' + (r.cols || rampLen(r)) + ',minmax(0,1fr))', rowGap: r.cols ? '14px' : undefined }}>
      {swatches(r).map(([lb, tok]) => {const v = V(tok);
      return <div key={lb}><div style={{ height: RAMP_H[r.size], background: v, border: isLight(v) ? '1px solid var(--line)' : '0', display: 'flex', alignItems: 'flex-end', padding: r.size === 'lg' ? '12px' : '0' }}>
          {(r.size === 'lg' || r.hex) && <span className="hx" style={{ color: isLight(v) ? '#0A0203' : '#FEFDFA' }}>{hex(v)}</span>}
        </div><div className="lb">{lb}</div></div>;})}
    </div>
    {r.note && <div className="note">{r.note}</div>}
  </div>;

const famCount = (cells) => cells.reduce((n, [,,, o = {}]) => n + (o.fams === undefined ? 1 : o.fams), 0);

function App() {
  const S = SYSTEM;
  const groupCells = S.groups.map(([label, build]) => [label, build()]);
  React.useLayoutEffect(() => {
    document.documentElement.style.setProperty('--ds-accent', V(S.accent));
    document.documentElement.style.setProperty('--ds-accent-soft', V(S.accentSoft));
  }, []);
  return <>
    <div className="ds__head"><div><h1>{S.name}</h1><div className="sub">{S.meta}</div></div></div>
    <div className="ds__stats">{S.stats.map(([b, l]) => <div key={l}><b>{b}</b><span>{l}</span></div>)}</div>
    <div className="ds">
      <Sec k="Logos" n="1 mark, 5 colourways">
        <div className="logos">
          <figure><div className="lp" style={{ background: '#fff', color: 'var(--db-black)' }}><Mark /></div><figcaption>Mark · black</figcaption></figure>
          <figure><div className="lp" style={{ background: '#fff', color: 'var(--db-p900)' }}><Mark /></div><figcaption>Mark · dark blue #192E4E</figcaption></figure>
          <figure><div className="lp" style={{ background: '#fff', color: 'var(--db-s900)' }}><Mark /></div><figcaption>Mark · mauve #7D4E57</figcaption></figure>
          <figure><div className="lp" style={{ background: 'var(--db-p950)', borderColor: 'var(--db-p950)', color: '#fff' }}><Mark /></div><figcaption>Mark · white on dark</figcaption></figure>
          <figure style={{ width: 320 }}><div className="lp" style={{ background: '#fff', color: 'var(--db-p900)' }}><span className="dblock"><Mark w={52} /><em>Donblas.AI</em></span></div><figcaption>Horizontal lockup · mark + wordmark</figcaption></figure>
        </div>
        <div className="note">{S.logoNote}</div>
      </Sec>
      <Sec k="Color" n="35 in Colors, 6 ungrouped">
        <div className="trirow">{S.ramps.map((r) => <div key={r.label} className={r.tertiary ? 'tri3' : r.secondary ? 'tri2' : 'tri1'}>
          <div className="ds__k" style={{ paddingBottom: 12 }}><span>{r.label}</span><span className="ln"></span><span>{rampLen(r)} values</span></div>
          <Ramp r={r} /></div>)}</div>
      </Sec>
      <Sec k="Support" n={S.support.length + ' ungrouped values'}>
        <div className="semi">{S.support.map(([n, t]) => <div key={n}><i style={{ background: V(t), boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.12)' }}></i>{n} · {hex(V(t))}</div>)}</div>
        <div className="note">Six colours sit outside the three ramps, in the Ungrouped collection: a warm grey trio, one error red, an off-white paper tone, and Sommsation Teal — carried over from the sister brand rather than native to Donblas.</div>
      </Sec>
      <Sec k="Type" n={S.type.families}>
        <div className="type">{S.type.rows.map(([n, tok, m, d, fam]) =>
          <div className="row" key={n}><div className="k">{n}<br />{tok}</div>
            <div style={{ fontFamily: fam === 'title' ? S.type.title : S.type.body, fontWeight: fam === 'title' ? 500 : 400, fontSize: d + 'px', lineHeight: 1.2, color: 'var(--db-ink)' }}>Donblas.AI</div>
            <div className="v">{m} mobile<br />{d} desktop</div></div>)}</div>
        <div className="note">{S.type.note}</div>
      </Sec>
      <Sec k="Iconography" n="47 glyphs, 13 families">
        <div className="icons">{S.icons.map(([base, cap]) => {
          const n = [24, 20, 32, 16].map((s) => base + s).find((k) => FIG[k]);
          return n ? <figure key={base}><i><Ig n={n} s={24} /></i><figcaption>{cap}</figcaption></figure> : null;
        })}</div>
        <div className="note">{S.iconNote}</div>
      </Sec>
      <Sec k="Space, radius and stroke" n="27 global tokens, 2 modes">
        <div className="trirow">
          <div>
            <div className="ds__k" style={{ paddingBottom: 12 }}><span>Spacing</span><span className="ln"></span><span>12 steps</span></div>
            <div className="scaleline">{S.space.map(([n, m, d]) => <div className="u" key={n}><i style={{ width: d + 'px' }}></i><span>{n}</span></div>)}</div>
            <div className="note" style={{ fontSize: 11.5 }}>{S.space.map(([n, m, d]) => n + ' ' + m + '/' + d).join(' · ')}</div>
          </div>
          <div>
            <div className="ds__k" style={{ paddingBottom: 12 }}><span>Radius</span><span className="ln"></span><span>9 steps</span></div>
            <div className="radii" style={{ marginTop: 0 }}>{S.radius.map(([n, m, d]) => <div key={n}><i style={{ borderRadius: d + 'px' }}></i><span>{n}</span><em>{d === 999 ? 'full' : m + '/' + d + 'px'}</em></div>)}</div>
          </div>
          <div>
            <div className="ds__k" style={{ paddingBottom: 12 }}><span>Stroke</span><span className="ln"></span><span>6 steps</span></div>
            <div className="db-col" style={{ gap: 14 }}>{S.stroke.map(([n, m, d]) =>
              <div key={n} className="dual" style={{ width: '100%', alignItems: 'center', gap: 14 }}>
                <i style={{ display: 'block', flex: 1, borderTop: d + 'px solid var(--db-p700)' }}></i>
                <b>{n}</b><span>{m}/{d}</span>
              </div>)}</div>
          </div>
        </div>
        <div className="note">Every global token carries a mobile and a desktop value; the pairs above read mobile/desktop, and the drawn specimens use the desktop value. Radius and stroke step up together at the larger breakpoint, so a card corner and its keyline stay in proportion.</div>
      </Sec>
      <div className="note" style={{ marginTop: 'clamp(30px,3.4vw,52px)' }}>Specimens are authored at the sizes, radii, strokes and colours the file's symbols carry, not scaled art. Two honest gaps: the source does not override button text colour per variant, so contrast on the eight fills is inferred from each fill's luminance; and Brandon Grotesque and Gotham are licensed faces with no web release, shown here in Jost. Coverage is partial by choice: the file declares 70 component sets, and this snapshot draws the nine atomic families a system is judged on. The remaining sets are responsive page blocks — Header, Hero, Content-Row, FullScreen-Block, Split-Content, Table and Footer, each triplicated across desktop, tablet and mobile — which belong in a layout appendix rather than here.</div>
      {groupCells.map(([label, cells]) =>
        <Sec key={label} k={'Components · ' + label} n={famCount(cells) + (famCount(cells) === 1 ? ' family' : ' families')}>
          <div className={S.layouts[label] === 'halves' ? 'halves' : 'grid'}>{cells.map(([t, sub, node, o = {}], i) =>
            <div key={t + '-' + i} className={'cell' + (o.wide ? ' wide' : '') + (o.w2 ? ' w2' : '')}>
              <div className="cell__t"><b>{t}</b>{sub ? ' · ' + sub : ''}</div>
              <div className="cell__b"><Fit s={o.scale || 1}>{node}</Fit></div>
            </div>)}
          </div>
        </Sec>)}
    </div>
  </>;
}
if (new URLSearchParams(location.search).get('capture') === '1') document.body.classList.add('capture');
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
