name: Weekly Site Report

on:
  schedule:
    # Every Monday at 14:00 UTC (~7am Pacific / 10am Eastern)
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every page's status code
        id: status
        run: |
          {
            echo "PUBLIC PAGES (expect 200):"
            for path in "/" "/robots.txt" "/sitemap.xml" "/handzin/" "/stead/" "/audit/"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.crystallangley.com${path}")
              echo "  ${path} -> ${code}"
            done
            echo ""
            echo "PASSWORD-GATED CASE STUDIES (expect 401 — that's correct/expected, keeps them out of Google):"
            for path in "/sommsation/" "/strivers/" "/sequoia-benefits/" "/donblas/" "/telltale/"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.crystallangley.com${path}")
              echo "  ${path} -> ${code}"
            done
          } > status.txt
          cat status.txt

      - name: Check locally-rehosted image liveness (sample)
        id: images
        run: |
          {
            echo "IMAGE LIVENESS (/assets/squarespace/ — rehosted locally so this should always be 200; a break here means something got deleted or moved):"
            find assets/squarespace -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) 2>/dev/null | sort | head -15 | while read -r f; do
              url="https://www.crystallangley.com/${f}"
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              echo "  ${code} - ${url}"
            done
          } > images.txt
          cat images.txt

      - name: Lighthouse CI on homepage
        id: lhci
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://www.crystallangley.com/
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

      - name: Open weekly report issue
        uses: actions/github-script@v7
        env:
          LHCI_MANIFEST: ${{ steps.lhci.outputs.manifest }}
        with:
          script: |
            const fs = require('fs');
            const status = fs.readFileSync('status.txt', 'utf8');
            const images = fs.readFileSync('images.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);

            // Pull real Lighthouse category scores out of the action's own
            // manifest output and format them inline, rather than pointing
            // at logs/artifacts that live on a rotating blob-storage URL
            // nobody can reliably fetch after the fact.
            let lighthouseSection;
            try {
              const manifest = JSON.parse(process.env.LHCI_MANIFEST || '[]');
              const run = manifest.find(r => r.isRepresentativeRun) || manifest[0];
              if (!run) throw new Error('no lighthouse run in manifest');
              const pct = (n) => Math.round(n * 100);
              const s = run.summary;
              lighthouseSection = [
                `| Category | Score |`,
                `|---|---|`,
                `| Performance | ${pct(s.performance)}/100 |`,
                `| Accessibility | ${pct(s.accessibility)}/100 |`,
                `| Best Practices | ${pct(s['best-practices'])}/100 |`,
                `| SEO | ${pct(s.seo)}/100 |`,
                ``,
                `Full HTML report (all individual audits, not just the category rollups): ${run.htmlPath || '(not uploaded this run)'}`,
              ].join('\n');
            } catch (e) {
              lighthouseSection = `Lighthouse step ran but its results couldn't be parsed this run (${e.message}). Check the "Lighthouse CI on homepage" step in the Actions run directly.`;
            }

            const body = [
              `## Weekly Site Report — ${date}`,
              ``,
              `### Page status codes`,
              '```',
              status.trim(),
              '```',
              ``,
              `### Rehosted image liveness (sample)`,
              '```',
              images.trim(),
              '```',
              ``,
              `### Lighthouse audit (homepage)`,
              lighthouseSection,
              ``,
              `### Real traffic / conversions`,
              `Not pulled here — GA4 (measurement ID G-689MH1TVSB) and Search Console are already live and have the real numbers. This report checks technical health (uptime, images, Lighthouse), not visitor data. Ask Claude to wire in a GA4 Data API pull (needs a service-account secret) if you want traffic numbers inside this same report instead of checking GA4 directly.`,
              ``,
              `_Automated weekly check. Anything showing an unexpected status code above needs a look — note only Sommsation/Strivers/Sequoia Benefits/Donblas/Telltale should ever show 401._`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Site Report — ${date}`,
              body,
              labels: ['weekly-report'],
            });
